{% extends 'blog/base.html' %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
    <h1 class="mb-3">{{ article.title }}</h1>
    <p class="text-muted">发布时间：{{ article.created_at|date:"Y-m-d H:i" }}</p>
    <hr>
    <div class="mt-4">
        {{ article.content|linebreaks }}
    </div>
    <a href="/blog/" class="btn btn-outline-primary mt-3">← 返回列表</a>
{% endblock %}
